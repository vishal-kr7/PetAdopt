<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adopt a Pet - PetAdopt</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark premium-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">PetAdopt</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="pets.html">Pets</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="adopt.html">Adopt</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Adoption Form -->
  <div class="container my-5">
    <h2 class="text-center mb-4">Adopt a Pet</h2>
    <input type="hidden" id="petId">
    <form id="adoptionForm">

      <div class="mb-3">
        <label for="petName" class="form-label">Pet Name</label>
        <input type="text" class="form-control" id="petName" placeholder="Which pet do you want to adopt?">
      </div>

      <div class="mb-3">
        <label for="yourName" class="form-label">Your Name</label>
        <input type="text" class="form-control" id="yourName" placeholder="Enter your full name" required>
      </div>

      <div class="mb-3">
        <label for="emailAddress" class="form-label">Email address</label>
        <input type="email" class="form-control" id="emailAddress" placeholder="name@example.com" required>
      </div>

      <div class="mb-3">
        <label for="phoneNumber" class="form-label">Phone Number</label>
        <input type="tel" class="form-control" id="phoneNumber" placeholder="Enter your phone number" required>
      </div>

      <div class="mb-3">
        <label for="address" class="form-label">Your Address</label>
        <textarea class="form-control" id="address" rows="3" placeholder="Enter your address" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Submit Request</button>

    </form>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="adopt.js"></script>
  <script>
    // Pre-fill pet name if available in URL
    const params = new URLSearchParams(window.location.search);
    const petNameFromUrl = params.get('pet');
    if (petNameFromUrl) {
      document.getElementById('petName').value = petNameFromUrl;
    }
    </script>

  
  <footer>
    <p>&copy; 2025 PetAdopt. All rights reserved.</p>
  </footer>

</body>
</html>
